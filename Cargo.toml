[package]
name = "crownos-sound-recorder"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Voice recorder for CrownOS"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
ffmpeg-next = { version = "9.0.0", default-features = false, features = [
  "codec",
  "format",
  "software-resampling",
] }
pipewire = { version = "0.10.1", features = ["v0_3_49"] }
rtrb = "0.3.5"
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time"] }
crownos-ipc = { path = "../crownos-ipc" }
crownos-config = { path = "../crownos-config", default-features = false }
crownui = { path = "../crownui/crownui", features = ["static", "audio"] }
audio = { path = "../crownui/audio" }
voice-protocol = { package = "crownos-voice-protocol", path = "../crownos-voice/crates/voice-protocol" }

[dev-dependencies]
tempfile = "3"
crowntest = { path = "../crownui/crowntest" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
